<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroStat LM Studio - Inducción de Habilidades & XAI</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- React & Babel Standalone via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-dark: #0a0d14;
      --bg-card: rgba(18, 24, 38, 0.75);
      --bg-card-hover: rgba(26, 34, 52, 0.85);
      --bg-input: rgba(13, 18, 30, 0.9);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(99, 102, 241, 0.35);
      
      --accent-primary: #6366f1;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-cyan: #06b6d4;

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      --shadow-glow: 0 0 25px rgba(99, 102, 241, 0.25);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 10% 20%, rgba(99, 102, 241, 0.12) 0px, transparent 40%),
        radial-gradient(at 90% 80%, rgba(168, 85, 247, 0.12) 0px, transparent 40%),
        radial-gradient(at 50% 50%, rgba(6, 182, 212, 0.06) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .glass-panel {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
    }

    /* Header */
    header {
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background: rgba(10, 13, 20, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand { display: flex; align-items: center; gap: 0.85rem; }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-sm);
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: var(--shadow-glow);
    }

    .brand-title {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.18);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stats-bar { display: flex; align-items: center; gap: 1rem; }

    .stat-chip {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.85rem;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      font-size: 0.82rem;
      font-weight: 500;
    }

    .stat-chip span.value {
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--accent-cyan);
    }

    /* Main Container */
    .app-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 410px;
      gap: 1.5rem;
      padding: 1.5rem 2rem;
      max-width: 1650px;
      width: 100%;
      margin: 0 auto;
      height: calc(100vh - 80px);
    }

    @media (max-width: 1080px) {
      .app-layout { grid-template-columns: 1fr; height: auto; }
    }

    /* Chat Section */
    .chat-section {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
    }

    /* Message Bubbles */
    .message-row {
      display: flex;
      gap: 1rem;
      max-width: 85%;
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .message-row.ai { align-self: flex-start; }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .avatar.user {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .avatar.ai {
      background: var(--accent-gradient);
      box-shadow: var(--shadow-glow);
    }

    .bubble-wrapper {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      width: 100%;
    }

    .bubble {
      padding: 1rem 1.25rem;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      line-height: 1.55;
    }

    .bubble.user {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: white;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.25);
    }

    .bubble.ai {
      background: rgba(20, 26, 42, 0.9);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
    }

    .intent-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .badge-intent {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .confidence-meter {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .confidence-bar {
      width: 60px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
      display: inline-block;
    }

    .confidence-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(to right, #10b981, #06b6d4);
      transition: width 0.5s ease;
    }

    /* Reasoning Box */
    .reasoning-box {
      margin-top: 0.85rem;
      border-radius: var(--radius-sm);
      background: rgba(10, 14, 26, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }

    .reasoning-header {
      padding: 0.65rem 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.02);
      user-select: none;
    }

    .reasoning-header:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .reasoning-content {
      padding: 0.9rem;
      font-size: 0.82rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    .token-chip {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-weight: 500;
    }

    .token-chip.positive {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .token-chip.negative {
      background: rgba(244, 63, 94, 0.15);
      color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    .rule-item {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      color: #cbd5e1;
      line-height: 1.45;
    }

    .rule-icon { color: #818cf8; font-size: 0.85rem; margin-top: 0.15rem; }

    .unknown-words-alert {
      padding: 0.6rem 0.8rem;
      border-radius: var(--radius-sm);
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.25);
      color: #fcd34d;
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .btn-quick-teach {
      background: rgba(245, 158, 11, 0.2);
      color: #fef08a;
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Suggestions */
    .suggestions-bar {
      padding: 0.65rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      overflow-x: auto;
      border-top: 1px solid var(--border-color);
      background: rgba(13, 18, 30, 0.5);
      scrollbar-width: thin;
      scrollbar-color: rgba(99, 102, 241, 0.35) transparent;
    }

    .suggestions-bar::-webkit-scrollbar {
      height: 4px;
    }
    .suggestions-bar::-webkit-scrollbar-track {
      background: transparent;
    }
    .suggestions-bar::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.35);
      border-radius: 999px;
    }
    .suggestions-bar::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.6);
    }

    .btn-refresh-sug {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }
    .btn-refresh-sug:hover {
      background: rgba(99, 102, 241, 0.25);
      color: #a5b4fc;
      border-color: rgba(99, 102, 241, 0.45);
      transform: rotate(180deg);
    }

    .suggestion-pill {
      font-size: 0.78rem;
      padding: 0.35rem 0.8rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .suggestion-pill:hover {
      background: rgba(99, 102, 241, 0.2);
      color: #c7d2fe;
      border-color: rgba(99, 102, 241, 0.45);
      transform: translateY(-1px);
    }

    /* Input Bar */
    .chat-input-bar {
      padding: 1rem 1.5rem;
      background: var(--bg-card);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .chat-input {
      flex: 1;
      padding: 0.85rem 1.2rem;
      border-radius: var(--radius-sm);
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }

    .chat-input:focus { border-color: #818cf8; }

    .btn-send {
      padding: 0.85rem 1.4rem;
      border-radius: var(--radius-sm);
      background: var(--accent-gradient);
      color: white;
      border: none;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      box-shadow: var(--shadow-glow);
      transition: transform 0.2s;
    }
    .btn-send:hover { transform: translateY(-2px); }
    .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Studio Sidebar */
    .training-studio {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .studio-header {
      padding: 1.1rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .studio-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.35rem;
    }

    .studio-body::-webkit-scrollbar { width: 5px; }
    .studio-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
    }

    .section-title {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      margin-bottom: 0.65rem;
    }

    /* Skill Cards Grid */
    .skill-cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .skill-card {
      padding: 0.65rem 0.75rem;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .skill-card:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(99, 102, 241, 0.4);
    }

    .skill-card.active {
      background: rgba(99, 102, 241, 0.15);
      border-color: #818cf8;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.25);
    }

    .skill-card-top {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .skill-card-sub {
      font-size: 0.7rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    /* Induce & Auto-Pilot Buttons */
    .btn-induce {
      width: 100%;
      padding: 0.75rem;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      font-weight: 600;
      font-size: 0.88rem;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
      transition: all 0.2s;
    }

    .btn-induce:hover { transform: translateY(-2px); }
    .btn-induce:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-autopilot {
      width: 100%;
      padding: 0.75rem;
      border-radius: var(--radius-sm);
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      font-weight: 600;
      font-size: 0.86rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    .btn-autopilot:hover {
      background: rgba(16, 185, 129, 0.25);
    }

    .btn-autopilot.running {
      background: rgba(244, 63, 94, 0.2);
      border-color: rgba(244, 63, 94, 0.5);
      color: #fb7185;
      animation: glowBorder 1.5s infinite;
    }

    @keyframes glowBorder {
      0% { box-shadow: 0 0 5px rgba(244, 63, 94, 0.4); }
      50% { box-shadow: 0 0 18px rgba(244, 63, 94, 0.7); }
      100% { box-shadow: 0 0 5px rgba(244, 63, 94, 0.4); }
    }

    /* Auto-pilot stream logs */
    .stream-log-box {
      min-height: 260px;
      max-height: 480px;
      resize: vertical;
      overflow-y: auto;
      padding: 0.85rem 1rem;
      background: rgba(8, 12, 22, 0.9);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.45);
    }

    .stream-log-box::-webkit-scrollbar {
      width: 6px;
    }

    .stream-log-box::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
    }

    .stream-log-entry {
      color: #94a3b8;
      display: flex;
      gap: 0.5rem;
      line-height: 1.5;
      padding: 2px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    .stream-log-entry .time {
      color: var(--accent-cyan);
      flex-shrink: 0;
    }

    .stream-log-entry .text {
      color: #cbd5e1;
      word-break: break-word;
    }

    .stream-log-entry.discovery {
      background: rgba(16, 185, 129, 0.16);
      border-radius: 6px;
      padding: 5px 8px;
      border-left: 3px solid var(--accent-emerald);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.15);
    }
    .stream-log-entry.discovery .text {
      color: #6ee7b7;
      font-weight: 600;
    }

    /* Form Card */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-bottom: 0.75rem;
    }

    .form-group label {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-input {
      padding: 0.6rem 0.8rem;
      border-radius: var(--radius-sm);
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.86rem;
      outline: none;
    }

    .form-input:focus { border-color: #818cf8; }

    .btn-teach {
      width: 100%;
      padding: 0.65rem;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      font-weight: 600;
      font-size: 0.86rem;
      border: none;
      cursor: pointer;
    }

    /* Vocabulary */
    .vocab-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      max-height: 130px;
      overflow-y: auto;
      padding: 0.5rem;
      background: rgba(10, 14, 26, 0.6);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
    }

    .vocab-chip {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 0.15rem 0.4rem;
      background: rgba(255, 255, 255, 0.04);
      color: #94a3b8;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
      box-shadow: 0 0 10px #10b981;
    }

    /* Modal de Evaluación */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 16, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1.5rem;
      animation: fadeIn 0.2s ease-out;
    }

    .modal-card {
      background: rgba(18, 24, 38, 0.98);
      border: 1px solid rgba(99, 102, 241, 0.45);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 820px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 35px rgba(99, 102, 241, 0.25);
      overflow: hidden;
    }

    .modal-header {
      padding: 1.2rem 1.6rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-refresh-eval {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.85rem;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.35);
      border-radius: var(--radius-sm);
      color: #c7d2fe;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-refresh-eval:hover:not(:disabled) {
      background: rgba(99, 102, 241, 0.28);
      border-color: #818cf8;
      color: #fff;
      transform: translateY(-1px);
    }

    .btn-refresh-eval:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-close-modal {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.25rem;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      transition: all 0.15s;
    }

    .btn-close-modal:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .modal-body {
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.35rem;
    }

    .eval-kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
    }

    .eval-kpi-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 0.85rem 0.6rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.35rem;
    }

    .eval-kpi-card .val {
      font-size: 1.35rem;
      font-weight: 700;
      color: #34d399;
      font-family: var(--font-mono);
    }

    .eval-kpi-card .lbl {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .class-perf-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .class-perf-table th {
      text-align: left;
      padding: 0.5rem 0.6rem;
      color: var(--text-dim);
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
    }

    .class-perf-table td {
      padding: 0.55rem 0.6rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-family: var(--font-mono);
    }

    .top-keyword-chip {
      display: inline-block;
      font-size: 0.68rem;
      padding: 2px 6px;
      margin-right: 4px;
      margin-bottom: 2px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 4px;
      color: #c7d2fe;
      font-family: var(--font-mono);
    }

    .etl-stat-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 0.75rem 1rem;
    }

    .outlier-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.45rem 0.75rem;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 6px;
      font-size: 0.78rem;
    }

    .action-card {
      padding: 0.75rem 1rem;
      background: rgba(30, 41, 59, 0.7);
      border-left: 3px solid #818cf8;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const API_BASE = window.location.origin.startsWith("http") ? window.location.origin : "http://127.0.0.1:8001";

    function App() {
      const [messages, setMessages] = useState([
        {
          id: "welcome-1",
          sender: "ai",
          text: "¡Hola! Estoy listo con soporte de inducción temática de habilidades. Puedes elegir una habilidad a la derecha (Código, Soporte, Datos o Agenda), inducir frases sintéticas o activar el bucle continuo para verme aprender solo.",
          meta: {
            intencion: "saludo",
            confianza: 0.95,
            reglas: [
              "Habilidades temáticas integradas: Código, Soporte Técnico, Datos y Agenda.",
              "Generador inductivo activo: combina palabras clave con plantillas sintácticas para auto-entrenar el modelo con cero ruido."
            ],
            palabras_reconocidas: [{ palabra: "hola", peso: 2.15, impacto: "positivo" }],
            palabras_nuevas: []
          }
        }
      ]);

      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const [modelState, setModelState] = useState({
        esta_entrenado: true,
        vocabulario_total: 0,
        ejemplos_totales: 0,
        clases: [],
        vocabulario_muestra: []
      });

      // Habilidades Temáticas
      const [skills, setSkills] = useState([]);
      const [selectedSkill, setSelectedSkill] = useState("cerebro_integral");
      const [inducing, setInducing] = useState(false);
      const [dynamicSuggestions, setDynamicSuggestions] = useState([]);

      // Auto-Piloto (Bucle continuo)
      const [autoPilot, setAutoPilot] = useState(false);
      const [streamLogs, setStreamLogs] = useState([]);
      const autoPilotRef = useRef(false);

      // Formulario manual
      const [teachText, setTeachText] = useState("");
      const [teachIntent, setTeachIntent] = useState("conversacion");
      const [teachResponse, setTeachResponse] = useState("");
      const [teaching, setTeaching] = useState(false);
      const [notice, setNotice] = useState(null);
      const [showTeachModal, setShowTeachModal] = useState(false);

      // Evaluación del LM
      const [evalData, setEvalData] = useState(null);
      const [showEvalModal, setShowEvalModal] = useState(false);
      const [loadingEval, setLoadingEval] = useState(false);
      const [balancing, setBalancing] = useState(false);
      const [balanceReport, setBalanceReport] = useState(null);

      const balanceDataset = async () => {
        if (!window.confirm("Esto reescribe el dataset dejando 25 ejemplos por clase técnica (poda la clase dominante y genera frases sintéticas para el resto). Se guarda una copia en dataset_entrenamiento.backup.json. ¿Continuar?")) return;
        setBalancing(true);
        try {
          const res = await fetch(`${API_BASE}/v1/balance-dataset`, { method: "POST" });
          if (res.ok) {
            const data = await res.json();
            setBalanceReport(data);
            setEvalData(data.evaluacion);
            fetchStateAndSkills();
          }
        } catch (e) {
          console.warn("Error al equilibrar clases:", e);
        } finally {
          setBalancing(false);
        }
      };

      const fetchEvaluation = async () => {
        setLoadingEval(true);
        try {
          const res = await fetch(`${API_BASE}/v1/evaluation`);
          if (res.ok) {
            const data = await res.json();
            setEvalData(data);
            setShowEvalModal(true);
          }
        } catch (e) {
          console.warn("Error al evaluar modelo:", e);
        } finally {
          setLoadingEval(false);
        }
      };

      const [openRules, setOpenRules] = useState({ "welcome-1": true });
      const messagesEndRef = useRef(null);

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      };

      useEffect(() => {
        scrollToBottom();
      }, [messages]);

      // Consultar estado, habilidades y sugerencias dinámicas del modelo
      const fetchStateAndSkills = async () => {
        try {
          const [stateRes, skillsRes, sugRes] = await Promise.all([
            fetch(`${API_BASE}/v1/state`),
            fetch(`${API_BASE}/v1/skills`),
            fetch(`${API_BASE}/v1/suggestions`)
          ]);

          if (stateRes.ok) {
            const data = await stateRes.json();
            setModelState(data);
          }
          if (skillsRes.ok) {
            const sData = await skillsRes.json();
            setSkills(sData);
            if (sData.length > 0) {
              if (!selectedSkill || !sData.some(s => s.id === selectedSkill)) {
                setSelectedSkill(sData[0].id);
              }
            }
          }
          if (sugRes.ok) {
            const sugData = await sugRes.json();
            setDynamicSuggestions(sugData);
          }
        } catch (err) {
          console.warn("API cargando:", err);
        }
      };

      const refreshSuggestions = async () => {
        try {
          const res = await fetch(`${API_BASE}/v1/suggestions`);
          if (res.ok) {
            const data = await res.json();
            setDynamicSuggestions(data);
          }
        } catch (e) {
          console.warn("Error al refrescar sugerencias:", e);
        }
      };

      const handlePruneDataset = async () => {
        try {
          const res = await fetch(`${API_BASE}/v1/prune-dataset`, { method: "POST" });
          if (res.ok) {
            const data = await res.json();
            setNotice({
              type: "success",
              msg: `¡Compactado! Reducido de ${data.ejemplos_antes} a ${data.ejemplos_despues} frases (Vocabulario intacto: ${data.vocabulario_conservado} palabras).`
            });
            fetchStateAndSkills();
          }
        } catch (e) {
          setNotice({ type: "error", msg: e.message });
        }
      };

      useEffect(() => {
        fetchStateAndSkills();
      }, []);

      // Chat
      const handleSendMessage = async (textToSend) => {
        const text = textToSend || input;
        if (!text.trim() || loading) return;

        const userMsg = { id: "usr-" + Date.now(), sender: "user", text };
        setMessages(prev => [...prev, userMsg]);
        setInput("");
        setLoading(true);

        try {
          const res = await fetch(`${API_BASE}/v1/chat`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mensaje: text })
          });

          if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
          const data = await res.json();
          const aiMsgId = "ai-" + Date.now();

          const aiMsg = {
            id: aiMsgId,
            sender: "ai",
            text: data.respuesta,
            meta: {
              intencion: data.intencion,
              confianza: data.confianza,
              palabras_reconocidas: data.palabras_reconocidas || [],
              palabras_nuevas: data.palabras_nuevas || [],
              reglas: data.reglas || [],
              frase_original: data.mensaje_usuario
            }
          };

          setMessages(prev => [...prev, aiMsg]);
          // Las reglas se mantienen colapsadas por defecto para dar protagonismo a la respuesta conversacional
          setOpenRules(prev => ({ ...prev, [aiMsgId]: false }));
          fetchStateAndSkills();
        } catch (err) {
          setMessages(prev => [
            ...prev,
            { id: "err-" + Date.now(), sender: "ai", text: `⚠️ Error: ${err.message}`, meta: null }
          ]);
        } finally {
          setLoading(false);
        }
      };

      // Inducir Entrenamiento de la Habilidad seleccionada
      const handleInduceTraining = async (cantidad = 3) => {
        if (!selectedSkill || inducing) return;
        setInducing(true);
        setNotice(null);

        try {
          const res = await fetch(`${API_BASE}/v1/induce-training`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ habilidad_id: selectedSkill, cantidad })
          });

          if (!res.ok) throw new Error("Fallo en la inducción temática");
          const data = await res.json();

          const skillObj = skills.find(s => s.id === selectedSkill);
          const icon = skillObj ? skillObj.icono : "⚡";

          // Log del stream con detección de palabras descubiertas
          const now = new Date().toLocaleTimeString();
          const newEntries = [];

          if (data.palabras_descubiertas && data.palabras_descubiertas.length > 0) {
            newEntries.push({
              time: now,
              text: `✨ [DESCUBRIMIENTO AUTÓNOMO]: "${data.palabras_descubiertas.join(', ')}" agregada a [${data.etiqueta}] -> Creando nuevos bigramas!`,
              isDiscovery: true
            });
          }

          data.frases_generadas.forEach(f => {
            newEntries.push({
              time: now,
              text: `[${data.etiqueta}] "${f}"`,
              isDiscovery: false
            });
          });

          setStreamLogs(prev => [...newEntries, ...prev].slice(0, 60));

          const discExtra = data.palabras_descubiertas && data.palabras_descubiertas.length > 0
            ? ` ¡Descubrió e integró: "${data.palabras_descubiertas.join(', ')}"!`
            : "";

          setNotice({
            type: "success",
            msg: `¡Éxito! Se sintetizaron y aprendieron ${data.frases_generadas.length} frases.${discExtra} Vocabulario: ${data.vocabulario_aprendido} palabras.`
          });

          fetchStateAndSkills();
        } catch (err) {
          setNotice({ type: "error", msg: `Error: ${err.message}` });
        } finally {
          setInducing(false);
        }
      };

      // Bucle Auto-Piloto Continuo (Play / Pause)
      useEffect(() => {
        autoPilotRef.current = autoPilot;
        let timer = null;

        if (autoPilot) {
          timer = setInterval(async () => {
            if (!autoPilotRef.current) return;
            try {
              const res = await fetch(`${API_BASE}/v1/induce-training`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ habilidad_id: selectedSkill, cantidad: 1 })
              });
              if (res.ok) {
                const data = await res.json();
                const now = new Date().toLocaleTimeString();
                const logsToAdd = [];

                if (data.palabras_descubiertas && data.palabras_descubiertas.length > 0) {
                  logsToAdd.push({
                    time: now,
                    text: `✨ [DESCUBRIMIENTO]: Auto-aprendida la palabra "${data.palabras_descubiertas.join(', ')}" en [${data.etiqueta}]`,
                    isDiscovery: true
                  });
                }

                logsToAdd.push({
                  time: now,
                  text: `[${data.etiqueta}] "${data.frases_generadas[0]}"`,
                  isDiscovery: false
                });

                setStreamLogs(prev => [
                  ...logsToAdd,
                  ...prev
                ].slice(0, 60));
                fetchStateAndSkills();
              }
            } catch (e) {
              console.warn("Auto-pilot error:", e);
            }
          }, 2600);
        }

        return () => {
          if (timer) clearInterval(timer);
        };
      }, [autoPilot, selectedSkill]);

      // Nutrir Manual
      const handleManualTeach = async (e) => {
        e.preventDefault();
        if (!teachText.trim() || !teachIntent.trim() || teaching) return;

        setTeaching(true);
        setNotice(null);

        try {
          const res = await fetch(`${API_BASE}/v1/teach`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              texto: teachText.trim(),
              etiqueta: teachIntent.trim(),
              respuesta: teachResponse.trim() || undefined
            })
          });

          if (!res.ok) throw new Error("Fallo al nutrir");
          const data = await res.json();
          setNotice({
            type: "success",
            msg: `¡Guardado! Vocabulario aumentado a ${data.vocabulario_aprendido} términos.`
          });
          setTeachText("");
          setTeachResponse("");
          fetchStateAndSkills();
        } catch (err) {
          setNotice({ type: "error", msg: err.message });
        } finally {
          setTeaching(false);
        }
      };

      const toggleRule = (msgId) => {
        setOpenRules(prev => ({ ...prev, [msgId]: !prev[msgId] }));
      };

      const activeSkillData = skills.find(s => s.id === selectedSkill);

      return (
        <React.Fragment>
          {/* Header */}
          <header>
            <div className="brand">
              <div className="brand-icon">🧠</div>
              <div>
                <div style={{ display: "flex", alignItems: "center", gap: "0.5rem" }}>
                  <h1 className="brand-title">NeuroStat LM Studio</h1>
                  <span className="brand-badge">Inducción Temática</span>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: "0.4rem", fontSize: "0.75rem", color: "var(--text-muted)", marginTop: "2px" }}>
                  <span className="pulse-dot"></span>
                  <span>FastAPI Activa en {API_BASE}</span>
                </div>
              </div>
            </div>

            <div className="stats-bar">
              <button 
                type="button"
                className="btn-quick-teach" 
                onClick={fetchEvaluation}
                disabled={loadingEval}
                style={{ 
                  background: "rgba(99, 102, 241, 0.22)", 
                  border: "1px solid rgba(99, 102, 241, 0.5)", 
                  color: "#a5b4fc",
                  display: "flex",
                  alignItems: "center",
                  gap: "0.4rem",
                  padding: "0.42rem 0.85rem",
                  borderRadius: "20px",
                  cursor: "pointer",
                  fontSize: "0.78rem"
                }}
                title="Diagnóstico formal: Validación Cruzada, F1-Score y salud del modelo"
              >
                <span>📊</span>
                <span style={{ fontWeight: 600 }}>{loadingEval ? "Evaluando..." : "Diagnóstico del LM"}</span>
              </button>

              <div className="stat-chip">
                <span>📚 Vocabulario:</span>
                <span className="value">{modelState.vocabulario_total}</span>
              </div>
              <div className="stat-chip">
                <span>🎯 Ejemplos:</span>
                <span className="value">{modelState.ejemplos_totales}</span>
              </div>
              <div className="stat-chip">
                <span>🏷️ Clases:</span>
                <span className="value">{modelState.clases?.length || 0}</span>
              </div>
            </div>
          </header>

          {/* Main Layout */}
          <main className="app-layout">
            {/* Chat Box */}
            <section className="chat-section glass-panel">
              <div className="chat-messages">
                {messages.map((msg) => (
                  <div key={msg.id} className={`message-row ${msg.sender}`}>
                    <div className={`avatar ${msg.sender}`}>
                      {msg.sender === "user" ? "👤" : "🤖"}
                    </div>

                    <div className="bubble-wrapper">
                      <div className={`bubble ${msg.sender}`}>
                        {msg.meta && (
                          <div className="intent-meta">
                            <span className="badge-intent">{msg.meta.intencion}</span>
                            <div className="confidence-meter">
                              <span>Confianza:</span>
                              <div className="confidence-bar">
                                <div 
                                  className="confidence-fill" 
                                  style={{ width: `${Math.round(msg.meta.confianza * 100)}%` }}
                                ></div>
                              </div>
                              <span style={{ fontWeight: 600 }}>{Math.round(msg.meta.confianza * 100)}%</span>
                            </div>
                          </div>
                        )}

                        <div style={{ fontSize: "1.02rem", fontWeight: "400", color: "#f8fafc", lineHeight: "1.6", marginBottom: msg.meta ? "0.6rem" : "0" }}>
                          {msg.text}
                        </div>

                        {/* Botón rápido para corregir o enseñar respuesta */}
                        {msg.meta && (
                          <div style={{ display: "flex", alignItems: "center", justifyContent: "flex-end", marginBottom: "0.5rem" }}>
                            <button
                              type="button"
                              className="btn-quick-teach"
                              style={{ display: "inline-flex", alignItems: "center", gap: "0.35rem", fontSize: "0.75rem", padding: "0.3rem 0.65rem", background: "rgba(99, 102, 241, 0.15)", border: "1px solid rgba(99, 102, 241, 0.4)", color: "#c7d2fe" }}
                              onClick={() => {
                                setTeachText(msg.meta.frase_original || "");
                                setTeachIntent(msg.meta.intencion || "conversacion");
                                setTeachResponse("");
                                setShowTeachModal(true);
                              }}
                              title="Enseñar a la IA qué responder cuando le digas esta frase"
                            >
                              <span>✏️</span>
                              <span>Enseñar / Corregir respuesta</span>
                            </button>
                          </div>
                        )}

                        {/* Reasoning Accordion */}
                        {msg.meta && (
                          <div className="reasoning-box">
                            <div 
                              className="reasoning-header" 
                              onClick={() => toggleRule(msg.id)}
                            >
                              <span>📐 Reglas Matemáticas & Razonamiento Usado</span>
                              <span>{openRules[msg.id] ? "▲ Ocultar" : "▼ Ver detalles"}</span>
                            </div>

                            {openRules[msg.id] && (
                              <div className="reasoning-content">
                                {msg.meta.palabras_reconocidas?.length > 0 && (
                                  <div>
                                    <div style={{ fontSize: "0.74rem", color: "var(--text-dim)", marginBottom: "0.3rem", fontWeight: 600 }}>
                                      TÉRMINOS ACTIVADOS EN VOCABULARIO:
                                    </div>
                                    <div style={{ display: "flex", flexWrap: "wrap", gap: "0.35rem" }}>
                                      {msg.meta.palabras_reconocidas.map((item, idx) => (
                                        <span key={idx} className={`token-chip ${item.impacto}`}>
                                          {item.palabra}
                                          <span style={{ opacity: 0.8 }}>
                                            ({item.peso > 0 ? `+${item.peso}` : item.peso})
                                          </span>
                                        </span>
                                      ))}
                                    </div>
                                  </div>
                                )}

                                <div style={{ display: "flex", flexDirection: "column", gap: "0.35rem" }}>
                                  {msg.meta.reglas?.map((rule, idx) => (
                                    <div key={idx} className="rule-item">
                                      <span className="rule-icon">✦</span>
                                      <span>{rule}</span>
                                    </div>
                                  ))}
                                </div>

                                {msg.meta.palabras_nuevas?.length > 0 && (
                                  <div className="unknown-words-alert">
                                    <span>
                                      No aprendidas: <strong>{msg.meta.palabras_nuevas.join(", ")}</strong>
                                    </span>
                                    <button 
                                      className="btn-quick-teach"
                                      onClick={() => {
                                        setTeachText(msg.meta.frase_original);
                                        setTeachIntent(msg.meta.intencion);
                                        setTeachResponse("");
                                      }}
                                    >
                                      Nutrir frase
                                    </button>
                                  </div>
                                )}
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                ))}

                {loading && (
                  <div className="message-row ai">
                    <div className="avatar ai">🤖</div>
                    <div className="bubble ai" style={{ color: "var(--text-muted)", fontStyle: "italic" }}>
                      Vectorizando con TF-IDF y evaluando pesos matemáticos...
                    </div>
                  </div>
                )}
                <div ref={messagesEndRef} />
              </div>

              {/* Suggestions */}
              <div className="suggestions-bar">
                <button 
                  type="button"
                  className="btn-refresh-sug" 
                  onClick={refreshSuggestions}
                  title="Generar nuevas frases sugeridas según las palabras y habilidades aprendidas"
                >
                  🔄
                </button>
                <span style={{ fontSize: "0.74rem", fontWeight: 700, color: "var(--text-dim)", textTransform: "uppercase", whiteSpace: "nowrap" }}>
                  Sugerencias dinámicas:
                </span>
                {(dynamicSuggestions.length > 0 ? dynamicSuggestions : [
                  "Tengo un error en el bucle de mi código python",
                  "Se cayó la conexión con el servidor y la contraseña",
                  "Vamos a calcular la probabilidad y graficar la matriz",
                  "Agendar una reunión urgente en mi calendario"
                ]).map((sug, i) => (
                  <button 
                    key={i} 
                    type="button"
                    className="suggestion-pill" 
                    onClick={() => setInput(sug)}
                    onDoubleClick={() => handleSendMessage(sug)}
                    title="Haz clic para cargar en la caja de texto (o doble clic para enviar)"
                  >
                    "{sug}"
                  </button>
                ))}

                  </div>

                  <button 
                    type="submit" 
                    className="btn-induce" 
                    disabled={teaching || !teachText.trim() || !teachResponse.trim()}
                  >
                    {teaching ? "Entrenando en caliente..." : "🚀 Enseñar y Aprender Ahora"}
                  </button>
                </form>
              </div>
            </div>
          )}
        </React.Fragment>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
